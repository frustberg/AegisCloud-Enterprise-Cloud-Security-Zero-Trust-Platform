# Save as .github/workflows/policy-gate.yml
#
# This runs on EVERY pull request touching Terraform, BEFORE the plan/apply
# workflow's own plan step is even worth looking at. Checkov scans the raw
# HCL; Conftest/OPA evaluates the actual plan JSON (catching things
# variable interpolation would hide from a pure static HCL scan). Either
# one failing blocks the merge — this is the actual "shift-left" gate, not
# just a linter that produces warnings nobody reads.

name: Policy-as-Code Gate

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          config_file: policy-as-code/checkov-config.yaml
          output_format: cli
          quiet: false
          soft_fail: false  # non-zero exit on findings = blocks the PR

  opa-conftest:
    runs-on: ubuntu-latest
    needs: checkov
    strategy:
      matrix:
        module:
          - terraform/foundation
          - terraform/guardrails
          - terraform/detection-remediation
          - terraform/guardduty
          - terraform/threat-intel-enrichment
          - terraform/iam-attack-path
          - terraform/containerized-workload
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aegiscloud-github-actions-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init & Plan (JSON)
        run: |
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.53.0/conftest_0.53.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.53.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Run OPA/Conftest policies
        run: conftest test --policy ../../policy-as-code/opa tfplan.json
