name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{github.Repository}}"
          echo "Ref: ${{ github.ref }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::600294641908:role/GitHubTerraformRole
          aws-region: ap-south-1
          
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - run: terraform init
        working-directory: terraform/verified-access

      - run: terraform apply -auto-approve -input=false
        working-directory: terraform/verified-access
        env:
          TF_VAR_vpc_id: vpc-0db3b05c246bb8500
          TF_VAR_demo_app_security_group_id: sg-0f7b89a7f3059de2d
          TF_VAR_demo_app_network_interface_id: eni-051711b8699cdde59
          TF_VAR_oidc_client_id: ec376090-40fb-4f29-9586-006216d7aca1
          TF_VAR_oidc_client_secret: 6e5385e6-1ad6-44d6-9080-cbca6eac54e3
          TF_VAR_oidc_issuer: https://login.microsoftonline.com/df96e48a-07b8-4d8a-bff0-eeeba22b1e43
      
